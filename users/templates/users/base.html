{% load static %}

<!DOCTYPE html>
<html>
<head>

    <title>
        {% block title %}
            My Django Project
        {% endblock %}
    </title>

    <link rel="stylesheet" href="{% static 'users/css/style.css' %}">

</head>

<body>

    <nav class="navbar">

        <div class="container">

            <a href="{% url 'home' %}" class="logo">
                My Django Project
            </a>

            <div class="nav-links">

                <a href="{% url 'home' %}">
                    Home
                </a>

                <a href="{% url 'create_student' %}">
                    Add Student
                </a>

            </div>

        </div>

    </nav>

    <main class="container">

        {% if messages %}

            {% for message in messages %}

                <div class="message">
                    {{ message }}
                </div>

            {% endfor %}

        {% endif %}

        {% block content %}
        {% endblock %}

    </main>

</body>
</html>
